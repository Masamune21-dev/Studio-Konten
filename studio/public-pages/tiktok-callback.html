<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Menyambungkan TikTok…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4efe6; color: #0e1a3a; font-family: system-ui, sans-serif; padding: 16px; }
  .card { background: #fffdf8; border-radius: 22px; padding: 28px; max-width: 460px; width: 100%; box-shadow: 0 10px 30px rgba(14,26,58,.08); }
  h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.02em; }
  p { line-height: 1.5; color: #5b6478; }
  code { display: block; word-break: break-all; background: #f4efe6; padding: 12px; border-radius: 12px; font-size: 13px; }
  button, a.btn { display: inline-block; margin-top: 14px; border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; background: #2b50ff; color: white; text-decoration: none; cursor: pointer; font-size: 15px; }
</style>
</head>
<body>
<div class="card">
  <h1>Menyambungkan TikTok…</h1>
  <p id="msg">Mengalihkan ke Studio Konten di Mac kamu.</p>
  <div id="manual" hidden>
    <p>Kalau halaman tidak berpindah (misalnya dibuka dari HP), salin kode ini lalu tempel di <b>Studio Konten → Pengaturan → TikTok</b>:</p>
    <code id="code"></code>
    <button id="copy">Salin kode</button>
    <a class="btn" id="go">Buka Studio di Mac ini</a>
  </div>
</div>
<script>
  // TikTok only accepts https redirect URIs, so this static page relays the
  // authorization code to the dashboard running on the user's Mac.
  var q = new URLSearchParams(location.search);
  var target = "http://localhost:4321/api/tiktok/callback" + location.search;
  document.getElementById("go").href = target;
  if (q.get("error")) {
    document.getElementById("msg").textContent = "TikTok menolak: " + (q.get("error_description") || q.get("error"));
  } else {
    document.getElementById("code").textContent = q.get("code") || "(tidak ada kode)";
    document.getElementById("manual").hidden = false;
    document.getElementById("copy").onclick = function () {
      navigator.clipboard.writeText(q.get("code") || "").then(function () { document.getElementById("copy").textContent = "Tersalin"; });
    };
    setTimeout(function () { location.href = target; }, 1200);
  }
</script>
</body>
</html>
